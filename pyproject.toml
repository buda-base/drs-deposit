[project]
name = "drs-deposit"
version = "2.0.1"
description = "DRS Deposit Services for DRS 3"
readme = "README.rst"
requires-python = ">=3.14"
dependencies = [
    "bdrc-db-models>=2.0.3",
    "cryptography>=47.0.0",
    "pathlib>=1.0.1",
    "pillow>=12.2.0",
    "s3pathlib>=2.3.6",
    "tqdm>=4.67.3",
    "bdrc-util2"
]
# uv native group
[dependency-groups]
dev =  [
    "apache-airflow>=2.0.0",
    "sphinx",
    "myst-parser",
    "docutils",  # reST processing
    "pip>=26.1.1",
    "debugpy>=1.8.20",
    "mypy>=1.11.0",
    "ruff>=0.6.9",
    "pytest>=8.3.0",
    # add other dev-only tools here
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"utils/xxxstaging_utils.py" = ["F401"]

[tool.mypy]
python_version = "3.14"
pretty = true
show_error_codes = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
strict_optional = true
no_implicit_optional = true
plugins = []

[[tool.mypy.overrides]]
module = ["utils.xxxstaging_utils"]
disable_error_code = ["attr-defined", "arg-type", "call-arg"]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.14"

[[tool.pyright.executionEnvironments]]
root = "."

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests requiring BDRC_DB_CNF and BDRC_DB_PASSWORD",
]
