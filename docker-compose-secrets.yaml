x-airflow-secrets-common: &airflow-secrets-common
  secrets:
    - airflow_fernet_key
    - airflow_jwt_secret
  environment:
    # Force file-backed values at runtime instead of plain env literals.
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__FERNET_KEY_CMD: "cat /run/secrets/airflow_fernet_key"
    AIRFLOW__API_AUTH__JWT_SECRET: ""
    AIRFLOW__API_AUTH__JWT_SECRET_CMD: "cat /run/secrets/airflow_jwt_secret"

x-airflow-secrets-runtime: &airflow-secrets-runtime
  <<: *airflow-secrets-common
  entrypoint: /opt/airflow/scripts/load_secret_env.sh

services:
  postgres:
    secrets:
      - postgres_password
    environment:
      POSTGRES_PASSWORD: ""
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password

  airflow-apiserver:
    <<: *airflow-secrets-runtime

  airflow-scheduler:
    <<: *airflow-secrets-runtime

  airflow-dag-processor:
    <<: *airflow-secrets-runtime
    secrets:
      - db_config
      - db_password
    environment:
      BDRC_DB_CNF: "/run/secrets/db_config"
      BDRC_DB_PASSWORD: ""
      BDRC_DB_PASSWORD_CMD: "cat /run/secrets/db_password"

  airflow-worker:
    <<: *airflow-secrets-runtime
    secrets:
      - db_config
      - db_password
      - aws_config
    environment:
      BDRC_DB_CNF: "/run/secrets/db_config"
      BDRC_DB_PASSWORD: ""
      BDRC_DB_PASSWORD_CMD: "cat /run/secrets/db_password"
    entrypoint: /opt/airflow/scripts/load_secret_env.sh

  airflow-triggerer:
    <<: *airflow-secrets-runtime
    secrets:
      - airflow_fernet_key
      - airflow_jwt_secret

  
  airflow-init:
    <<: *airflow-secrets-common
    # secrets:
    #   - airflow_admin_password
    # environment:
    #   _AIRFLOW_WWW_USER_PASSWORD: ""
    #   _AIRFLOW_WWW_USER_PASSWORD_CMD: "cat /run/secrets/airflow_admin_password"

  airflow-cli:
    <<: *airflow-secrets-runtime

  flower:
    <<: *airflow-secrets-runtime

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  airflow_fernet_key:
    file: ./secrets/airflow_fernet_key.txt
  airflow_jwt_secret:
    file: ./secrets/airflow_jwt_secret.txt
  airflow_admin_password:
    file: ./secrets/airflow_admin_password.txt
  db_config:
    file: ./secrets/drs_lib_db2.cnf
  db_password:
    file: ./secrets/db_password.txt
  aws_config:
    file: ./secrets/aws_config.txt
